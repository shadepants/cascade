# Nginx reverse-proxy config snippet for the Anthropic API
# Place this inside your `server {}` block.
#
# This proxies all browser requests to /api/anthropic/* to the real
# Anthropic API endpoint, injecting your server-side API key so that
# it is never exposed in the browser bundle.
#
# IMPORTANT: Replace YOUR_ANTHROPIC_API_KEY with your actual key.
# Consider loading it from an environment variable via envsubst(1)
# or a secrets manager rather than hard-coding it here.

location /api/anthropic/ {
    # Strip the /api/anthropic prefix before forwarding
    rewrite ^/api/anthropic/(.*) /$1 break;

    proxy_pass         https://api.anthropic.com;
    proxy_ssl_server_name on;

    # Inject the API key — never expose this in client-side code
    proxy_set_header   x-api-key "YOUR_ANTHROPIC_API_KEY";
    proxy_set_header   anthropic-version "2023-06-01";
    proxy_set_header   content-type "application/json";

    # Forward real IP
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Host              api.anthropic.com;

    # Timeouts suitable for streaming LLM responses
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    # Allow large request/response bodies (for long conversation histories)
    client_max_body_size 4m;
    proxy_buffering off;
}
